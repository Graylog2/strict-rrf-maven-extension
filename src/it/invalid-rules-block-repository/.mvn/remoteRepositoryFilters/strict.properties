# Project-local configuration with invalid rules, auto-discovered without setting the basedir property.
#
# Without the invalid deny pattern this would allow everything from central. Versions are not
# matched, so 'groupId:artifactId:version' is invalid: instead of silently never matching, it
# blocks the whole repository (fail-secure).
repo.central.allow = *
repo.central.deny = com.google.guava:guava:31.0

# Duplicate keys block the repository they belong to (Properties would keep only the last line).
repo.other.allow = org.slf4j
repo.other.allow = org.apache
